<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuples and List in Python</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Young+Serif&display=swap" rel="stylesheet">

    <style>
        :root {
            --wall: #16322A;
            --wall-deep: #0F241E;
            --card: #E8EDE6;
            --ink: #1B2A24;
            --ink-soft: #3C4E45;
            --brass: #C49A3C;
            --granted: #1F6B45;
            --denied: #A8321F;
            --on-wall: #F1F4EE;
            --on-wall-soft: #C9D6CC;

            --serif: "Young Serif", Georgia, "Times New Roman", serif;
            --typed: "Courier Prime", "Courier New", Courier, monospace;
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 2rem 1.25rem;
            color: var(--on-wall);
            font-family: var(--typed);
            /* wood-panelled wall: faint vertical seams */
            background-color: var(--wall);
            background-image: repeating-linear-gradient(
                90deg,
                transparent 0 119px,
                rgba(0, 0, 0, 0.22) 119px 120px
            );
        }

        .door {
            width: 100%;
            max-width: 62rem;
            display: grid;
            gap: 3rem;
            align-items: center;
        }

        @media (min-width: 860px) {
            .door {
                grid-template-columns: minmax(0, 1fr) minmax(0, 26rem);
                gap: 4.5rem;
            }
        }

        /* ---------- left: the question ---------- */
        .intro h1 {
            margin: 0 0 1.25rem;
            font-family: var(--serif);
            font-weight: 400;
            font-size: clamp(2.5rem, 7vw, 4.75rem);
            line-height: 1.04;
            letter-spacing: -0.01em;
            color: var(--on-wall);
            text-wrap: balance;
        }

        .intro p {
            margin: 0;
            max-width: 34ch;
            font-size: 1.1rem;
            line-height: 1.6;
            color: var(--on-wall-soft);
        }

        /* ---------- right: the card ---------- */
        .card {
            position: relative;
            padding: 1.75rem 1.75rem 1.5rem;
            background: var(--card);
            color: var(--ink);
            border-top: 10px solid var(--brass);
            border-radius: 3px;
            box-shadow: 0 22px 34px -14px rgba(0, 0, 0, 0.6);
            transform: rotate(-0.8deg);
        }

        @media (min-width: 860px) {
            .card { transform: rotate(-1.5deg); }
        }

        .card h2 {
            margin: 0 0 1.5rem;
            font-family: var(--serif);
            font-weight: 400;
            font-size: 1.5rem;
            line-height: 1.2;
        }

        .card label {
            display: block;
            font-size: 1rem;
            color: var(--ink-soft);
        }

        .card input[type="text"] {
            display: block;
            width: 100%;
            margin: 0 0 1.4rem;
            padding: 0.35rem 0.25rem 0.3rem;
            font-family: var(--typed);
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--ink);
            background: transparent;
            border: 0;
            border-bottom: 2px solid var(--ink);
            border-radius: 0;
        }

        .card input[type="text"]:focus-visible {
            outline: 3px solid var(--wall);
            outline-offset: 3px;
            background: rgba(196, 154, 60, 0.18);
        }

        .card button {
            display: block;
            width: 100%;
            padding: 0.9rem 1rem;
            font-family: var(--serif);
            font-size: 1.15rem;
            color: var(--on-wall);
            background: var(--wall);
            border: 0;
            border-bottom: 4px solid var(--brass);
            border-radius: 2px;
            cursor: pointer;
        }

        .card button:hover { background: var(--wall-deep); }
        .card button:active { transform: translateY(2px); }
        .card button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 3px;
        }

        /* ---------- the result: a message plus a rubber stamp ---------- */
        #result {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem 1.25rem;
            min-height: 8.5rem;
            margin-top: 1.5rem;
            padding-top: 1.25rem;
            border-top: 2px dashed rgba(27, 42, 36, 0.35);
            font-size: 1.05rem;
            line-height: 1.5;
        }

        #result > * { flex: 1 1 12rem; margin: 0; }

        #result.granted::before,
        #result.denied::before {
            flex: 0 0 auto;
            padding: 0.35rem 0.8rem;
            font-family: var(--serif);
            font-size: 1.15rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            border: 3px double currentColor;
            border-radius: 3px;
            transform: rotate(-6deg);
            animation: stamp 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
        }

        #result.granted { color: var(--ink); }
        #result.denied  { color: var(--ink); }

        #result.granted::before { content: "Admitted";        color: var(--granted); }
        #result.denied::before  { content: "Not on the list"; color: var(--denied); }

        @keyframes stamp {
            from { transform: rotate(-16deg) scale(2.2); opacity: 0; }
            to   { transform: rotate(-6deg)  scale(1);   opacity: 0.92; }
        }

        @media (prefers-reduced-motion: reduce) {
            #result.granted::before,
            #result.denied::before { animation: none; }
        }
    </style>
</head>
<body>
    <main class="door">
        <section class="intro">
            <h1>Is your name on the door list?</h1>
            <p>Type your first and last name. The doorman checks it against the member list and tells you if you're in or not. Spell it exactly as you'd sign it in a paper, not case-sensitive.</p>
        </section>

        <form class="card" autocomplete="off" onsubmit="return false">
            <h2>The Presidents' Club</h2>

            <label for="firstname">First name</label>
            <input type="text" id="firstname">

            <label for="lastname">Last name</label>
            <input type="text" id="lastname">

            <button type="button" py-click="club_check">Check my name</button>

            <div id="result" aria-live="polite"></div>
        </form>
    </main>

    <py-script src="main.py"></py-script>
</body>
</html>
